{% extends "base.html" %}
{% block title %}Edit — {{ filename }}{% endblock %}
{% block content %}
<h1 class="page-title">Edit: {{ filename }}</h1>

<form method="POST" action="/edit/{{ path }}">
    <textarea name="content" class="edit-area">{{ content }}</textarea>
    <div style="margin-top:16px; display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ request.referrer or '/drafts' }}" class="btn btn-outline">Cancel</a>
    </div>
</form>
{% endblock %}
